<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Animal Arena Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f8fafc;
      min-width: 220px;
    }
    .hud-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .hud-value {
      font-size: 20px;
      font-weight: bold;
      color: #facc15;
    }
    .hp-bar-outer {
      width: 100%;
      height: 16px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .hp-bar-inner {
      width: 100%;
      height: 100%;
      background: #22c55e;
      transition: width 0.15s ease-out;
    }
    #menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #fff;
    }
    .menu-card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      background: #7dd3fc;
    }
    #controls-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- HUD -->
  <div id="ui-container">
    <div class="hud-card">
      <div class="hud-title">Player Health</div>
      <div class="hp-bar-outer">
        <div id="hp-fill" class="hp-bar-inner"></div>
      </div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Coins Collected</div>
      <div id="coin-count" class="hud-value">0</div>
    </div>
  </div>

  <!-- START MENU -->
  <div id="menu-overlay">
    <div class="menu-card">
      <h1 style="margin-top: 0; color: #facc15;">ANIMAL ARENA</h1>
      <p style="color: #94a3b8;">Select your character to enter battle:</p>
      <div>
        <button class="btn" onclick="startGame('Bear')">Bear (High HP)</button>
        <button class="btn" onclick="startGame('Bunny')">Bunny (Fast)</button>
        <button class="btn" onclick="startGame('Cat')">Cat (Balanced)</button>
      </div>
    </div>
  </div>

  <div id="controls-hint">WASD / Arrows to Move | Space to Attack</div>

  <!-- Three.js Library -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    // --- 1. LOCAL SAVE SYSTEM ---
    const SaveSystem = {
      KEY: 'game_save_data_v1',
      save(data) {
        try { localStorage.setItem(this.KEY, JSON.stringify(data)); }
        catch (e) { console.warn('Save error:', e); }
      },
      load(defaultData) {
        try {
          const raw = localStorage.getItem(this.KEY);
          return raw ? { ...defaultData, ...JSON.parse(raw) } : defaultData;
        } catch (e) { return defaultData; }
      }
    };

    let gameState = SaveSystem.load({ coins: 0, unlockedCharacters: ['Bear'] });
    document.getElementById('coin-count').innerText = gameState.coins;

    // --- 2. THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(15, 30, 15);
    scene.add(dirLight);

    // Arena Court
    const grid = new THREE.GridHelper(80, 40, 0x38bdf8, 0x334155);
    scene.add(grid);

    // --- 3. CHARACTER MESH BUILDER ---
    function buildCharacterMesh(type) {
      const group = new THREE.Group();
      let color = 0x38bdf8;
      
      if (type === 'Bear') color = 0x8b5cf6; // Purple
      if (type === 'Bunny') color = 0x38bdf8; // Light Blue
      if (type === 'Cat') color = 0xfacc15; // Yellow
      if (type === 'Enemy') color = 0xef4444; // Red

      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });

      // Body
      const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16);
      const body = new THREE.Mesh(bodyGeo, mat);
      body.position.y = 0.6;
      group.add(body);

      // Head
      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const head = new THREE.Mesh(headGeo, mat);
      head.position.y = 1.3;
      group.add(head);

      return group;
    }

    // --- 4. ENTITY CLASS (HP & ACTIONS) ---
    class Entity {
      constructor(type, x, z, maxHp, isPlayer = false) {
        this.type = type;
        this.maxHp = maxHp;
        this.hp = maxHp;
        this.isPlayer = isPlayer;

        this.mesh = buildCharacterMesh(type);
        this.mesh.position.set(x, 0, z);
        scene.add(this.mesh);

        // Enemy HP Indicator
        if (!isPlayer) {
          const hpGeo = new THREE.BoxGeometry(1.2, 0.12, 0.12);
          const hpMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
          this.hpMesh = new THREE.Mesh(hpGeo, hpMat);
          this.hpMesh.position.set(0, 2.0, 0);
          this.mesh.add(this.hpMesh);
        }
      }

      takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        this.updateHealthUI();
        if (this.hp === 0) {
          this.onDeath();
        }
      }

      updateHealthUI() {
        if (this.isPlayer) {
          const hpPercent = (this.hp / this.maxHp) * 100;
          document.getElementById('hp-fill').style.width = `${hpPercent}%`;
        } else if (this.hpMesh) {
          this.hpMesh.scale.x = this.hp / this.maxHp;
        }
      }

      onDeath() {
        scene.remove(this.mesh);
        if (!this.isPlayer) {
          gameState.coins += 10;
          document.getElementById('coin-count').innerText = gameState.coins;
          SaveSystem.save(gameState);
        }
      }
    }

    let player = null;
    let enemies = [];

    // --- 5. CAMERA SYSTEM (HIGH & BEHIND) ---
    const CAMERA_OFFSET = new THREE.Vector3(0, 10, 12);

    function updateCamera() {
      if (!player) return;
      camera.position.x = player.mesh.position.x + CAMERA_OFFSET.x;
      camera.position.y = player.mesh.position.y + CAMERA_OFFSET.y;
      camera.position.z = player.mesh.position.z + CAMERA_OFFSET.z;
      camera.lookAt(player.mesh.position.x, player.mesh.position.y + 0.8, player.mesh.position.z);
    }

    // --- 6. CONTROLS & ATTACK LOGIC ---
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space') attack();
    });
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    let moveSpeed = 0.16;

    function handleInput() {
      if (!player || player.hp <= 0) return;

      if (keys['w'] || keys['arrowup']) player.mesh.position.z -= moveSpeed;
      if (keys['s'] || keys['arrowdown']) player.mesh.position.z += moveSpeed;
      if (keys['a'] || keys['arrowleft']) player.mesh.position.x -= moveSpeed;
      if (keys['d'] || keys['arrowright']) player.mesh.position.x += moveSpeed;
    }

    function attack() {
      if (!player || player.hp <= 0) return;

      enemies.forEach((enemy) => {
        if (enemy.hp > 0) {
          const dist = player.mesh.position.distanceTo(enemy.mesh.position);
          if (dist < 3.0) {
            enemy.takeDamage(25);
          }
        }
      });
    }

    // --- 7. GAME INITIALIZATION ---
    function startGame(characterType) {
      document.getElementById('menu-overlay').style.display = 'none';

      let hp = 100;
      if (characterType === 'Bear') { hp = 150; moveSpeed = 0.14; }
      if (characterType === 'Bunny') { hp = 80; moveSpeed = 0.22; }
      if (characterType === 'Cat') { hp = 100; moveSpeed = 0.17; }

      player = new Entity(characterType, 0, 0, hp, true);

      // Spawn Enemies
      enemies = [
        new Entity('Enemy', 6, -8, 50),
        new Entity('Enemy', -7, -10, 50),
        new Entity('Enemy', 10, -14, 50)
      ];
    }

    // --- 8. RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      handleInput();
      updateCamera();

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
