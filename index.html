<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Web Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f8fafc;
      min-width: 220px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .hud-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .hud-value {
      font-size: 20px;
      font-weight: bold;
      color: #facc15;
    }
    .hp-bar-outer {
      width: 100%;
      height: 16px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .hp-bar-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 0.15s ease-out, background-color 0.15s ease;
    }
    #controls-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="hud-card">
      <div class="hud-title">Player Health</div>
      <div class="hp-bar-outer">
        <div id="hp-fill" class="hp-bar-inner"></div>
      </div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Coins Collected</div>
      <div id="coin-count" class="hud-value">0</div>
    </div>
  </div>

  <div id="controls-hint">Use WASD or Arrow Keys to move</div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- 1. LOCAL SAVE CONTROLLER ---
    const SaveSystem = {
      KEY: 'game_save_data_v1',
      save(data) {
        try {
          localStorage.setItem(this.KEY, JSON.stringify(data));
        } catch (e) {
          console.warn('Save failed:', e);
        }
      },
      load(defaultData) {
        try {
          const raw = localStorage.getItem(this.KEY);
          return raw ? { ...defaultData, ...JSON.parse(raw) } : defaultData;
        } catch (e) {
          return defaultData;
        }
      }
    };

    let gameState = SaveSystem.load({ coins: 0 });
    document.getElementById('coin-count').innerText = gameState.coins;

    // --- 2. THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Ground Plane
    const grid = new THREE.GridHelper(100, 50, 0x38bdf8, 0x1e293b);
    grid.position.y = 0;
    scene.add(grid);

    // --- 3. ENTITY CLASS (PLAYER & BOTS) ---
    class Entity {
      constructor(color, x, z, maxHp, isPlayer = false) {
        this.maxHp = maxHp;
        this.hp = maxHp;
        this.isPlayer = isPlayer;

        // Visual Representation
        const geometry = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
        const material = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.position.set(x, 1, z);
        this.mesh.castShadow = true;
        scene.add(this.mesh);

        // Simple Floating Overhead HP Indicator Mesh for Non-Player Entities
        if (!isPlayer) {
          const hpGeo = new THREE.BoxGeometry(1.2, 0.15, 0.15);
          const hpMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
          this.hpMesh = new THREE.Mesh(hpGeo, hpMat);
          this.hpMesh.position.set(0, 1.2, 0);
          this.mesh.add(this.hpMesh);
        }
      }

      takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        this.updateHealthUI();
        if (this.hp === 0) {
          this.onDeath();
        }
      }

      updateHealthUI() {
        if (this.isPlayer) {
          const hpPercent = (this.hp / this.maxHp) * 100;
          const hpBar = document.getElementById('hp-fill');
          hpBar.style.width = `${hpPercent}%`;
          
          if (hpPercent < 30) {
            hpBar.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
          } else if (hpPercent < 60) {
            hpBar.style.background = 'linear-gradient(90deg, #facc15, #eab308)';
          } else {
            hpBar.style.background = 'linear-gradient(90deg, #22c55e, #16a34a)';
          }
        } else if (this.hpMesh) {
          const scale = this.hp / this.maxHp;
          this.hpMesh.scale.x = scale;
        }
      }

      onDeath() {
        scene.remove(this.mesh);
      }
    }

    // Spawn Entities
    const player = new Entity(0x38bdf8, 0, 0, 100, true);

    const enemies = [
      new Entity(0xef4444, 6, -8, 50),
      new Entity(0xef4444, -7, -12, 50),
      new Entity(0xef4444, 10, -15, 50)
    ];

    // --- 4. CAMERA CONFIGURATION (HIGH & BEHIND) ---
    // Offset values: Elevated above (Y) and pulled back behind (Z)
    const CAMERA_OFFSET = new THREE.Vector3(0, 10, 12);

    function updateCamera() {
      // Set camera relative to player position
      camera.position.x = player.mesh.position.x + CAMERA_OFFSET.x;
      camera.position.y = player.mesh.position.y + CAMERA_OFFSET.y;
      camera.position.z = player.mesh.position.z + CAMERA_OFFSET.z;

      // Look slightly ahead of the player to maintain visibility behind them
      const lookAtTarget = player.mesh.position.clone().add(new THREE.Vector3(0, 0.5, -2));
      camera.lookAt(lookAtTarget);
    }

    // --- 5. INPUT & MOVEMENT LOGIC ---
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    const moveSpeed = 0.18;

    function handleMovement() {
      if (player.hp <= 0) return;

      if (keys['w'] || keys['arrowup']) player.mesh.position.z -= moveSpeed;
      if (keys['s'] || keys['arrowdown']) player.mesh.position.z += moveSpeed;
      if (keys['a'] || keys['arrowleft']) player.mesh.position.x -= moveSpeed;
      if (keys['d'] || keys['arrowright']) player.mesh.position.x += moveSpeed;
    }

    // --- 6. MAIN GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      handleMovement();
      updateCamera();

      renderer.render(scene, camera);
    }

    // Window Resizing Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
